<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>Посещаемость класса</title>
<style>
:root {
  --bg:#f6f7fb;
  --card:#fff;
  --ink:#111827;
  --muted:#6b7280;
  --soft:#eef0f5;
  --line:#e8eaf0;
  --primary:#6366f1;
  --primary-soft:#eef0ff;
  --green:#22c55e;
  --green-soft:#ecfdf3;
  --orange:#f59e0b;
  --orange-soft:#fff7e6;
  --red:#ef4444;
  --red-soft:#fff0f0;
  --shadow:0 8px 28px rgba(17,24,39,.055);
  --shadow-sm:0 3px 12px rgba(17,24,39,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(99,102,241,.055),transparent 30%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{
  width:min(100%,760px);
  margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 14px 30px;
}
.header{padding:4px 4px 14px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--primary);font-size:11px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--primary);display:block}
h1{font-size:29px;line-height:1.08;letter-spacing:-.035em;margin:0;font-weight:800}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.4}

.search-wrap{position:relative;margin:4px 0 12px}
.search-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:#8b93a3;font-size:18px;pointer-events:none;
}
#search{
  width:100%;height:50px;border:1px solid rgba(226,229,237,.9);
  background:rgba(255,255,255,.92);border-radius:16px;outline:none;
  padding:0 16px 0 45px;color:var(--ink);font-size:15px;
  box-shadow:var(--shadow-sm);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
#search::placeholder{color:#9aa1af}
#search:focus{border-color:rgba(99,102,241,.4);box-shadow:0 0 0 4px rgba(99,102,241,.08),var(--shadow-sm)}

.filters{
  display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
  margin:0 0 14px;padding:1px 1px 3px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;
  color:#687083;border-radius:999px;height:37px;padding:0 14px;
  font-size:12px;font-weight:750;cursor:pointer;
  transition:transform .18s,background .18s,color .18s,border-color .18s,box-shadow .18s;
  box-shadow:0 2px 7px rgba(17,24,39,.025);
}
.filter:active{transform:scale(.95)}
.filter.active{
  color:#fff;background:var(--primary);border-color:var(--primary);
  box-shadow:0 6px 15px rgba(99,102,241,.2);
}

.list{display:grid;gap:10px}
.card{
  background:rgba(255,255,255,.96);border:1px solid var(--line);
  border-radius:17px;padding:14px;
  box-shadow:var(--shadow-sm);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s;
  animation:cardIn .28s both;
}
.card:active{transform:scale(.992)}
.card-top{display:flex;align-items:center;gap:11px;min-width:0}
.badge{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;
  display:grid;place-items:center;background:#f1f3f7;color:#8b94a5;
  font-size:11px;font-weight:800;letter-spacing:.02em;
}
.identity{min-width:0;flex:1}
.name{
  font-size:16px;line-height:1.15;font-weight:760;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.current{
  display:inline-flex;align-items:center;gap:5px;margin-top:5px;
  color:#8a92a1;font-size:11px;font-weight:650;
}
.current .dot{width:5px;height:5px;border-radius:50%;background:#aeb4c0}
.card[data-status="present"] .current{color:#168a45}
.card[data-status="present"] .current .dot{background:var(--green)}
.card[data-status="late"] .current{color:#b66d00}
.card[data-status="late"] .current .dot{background:var(--orange)}
.card[data-status="absent"] .current{color:#c83232}
.card[data-status="absent"] .current .dot{background:var(--red)}

.statuses{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;
}
.status{
  min-width:0;height:42px;border:1px solid #e7e9ef;border-radius:12px;
  background:#f8f9fb;color:#7a8291;display:flex;align-items:center;
  justify-content:center;gap:6px;padding:0 6px;cursor:pointer;
  font-size:11px;font-weight:760;letter-spacing:-.01em;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),background .18s,color .18s,border-color .18s,box-shadow .18s;
  position:relative;overflow:hidden;
}
.status .icon{font-size:14px;line-height:1}
.status:active{transform:scale(.94)}
.status[data-status="present"].active{background:var(--green-soft);color:#159447;border-color:#bdeccf;box-shadow:0 5px 12px rgba(34,197,94,.1)}
.status[data-status="late"].active{background:var(--orange-soft);color:#b86f00;border-color:#f8d797;box-shadow:0 5px 12px rgba(245,158,11,.1)}
.status[data-status="absent"].active{background:var(--red-soft);color:#d33434;border-color:#fac6c6;box-shadow:0 5px 12px rgba(239,68,68,.1)}


.empty{
  text-align:center;padding:35px 15px;color:#8991a0;font-size:13px;
  background:rgba(255,255,255,.55);border:1px dashed #dfe2e9;border-radius:16px;
}
.reset-row{display:flex;justify-content:center;margin:2px 0 12px}
.reset-all{
  border:0;background:transparent;color:#858c99;font-size:11px;font-weight:700;
  padding:7px 10px;border-radius:9px;cursor:pointer;
  transition:background .18s,color .18s,transform .16s;
}
.reset-all:hover{background:#fff;color:#636b79}
.reset-all:active{transform:scale(.95)}

.warning{color:#c33b3b;background:#fff1f1;border-radius:10px;padding:9px 10px;font-size:11px;font-weight:700;margin-bottom:12px}

@keyframes cardIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (min-width:600px){
  .app{padding-left:20px;padding-right:20px;padding-top:32px}
  .header{padding-bottom:17px}
  .card{padding:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="eyebrow"><i></i> Класс</div>
    <h1>Посещаемость класса</h1>
    <p class="subtitle">Отметьте статус каждого ученика</p>
  </header>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="search" autocomplete="off" placeholder="Найти ученика" aria-label="Найти ученика">
  </div>

  <nav class="filters" aria-label="Фильтр учеников">
    <button class="filter active" data-filter="all">Все</button>
    <button class="filter" data-filter="present">Пришли</button>
    <button class="filter" data-filter="late">Опоздали</button>
    <button class="filter" data-filter="absent">Отсутствуют</button>
    <button class="filter" data-filter="unmarked">Не отмечены</button>
  </nav>

  <div class="reset-row">
    <button id="resetAll" class="reset-all">↺ Сбросить статусы</button>
  </div>

  <section id="list" class="list" aria-live="polite"></section>
</main>


<script>
const students = [
  "Анисимов Денис","Барков Владислав","Богданов Михаил","Васильев Даниил",
  "Васильева Ксения","Вахтерова Ариана","Гайнова Яна","Гамидов Евгений",
  "Денисов Сергей","Дудник Виктор","Дыдышко Иван","Дьячков Егор",
  "Запорожцев Иван","Кахидзе Кира","Краснов Никита","Лавров Иван",
  "Липатова Екатерина","Локтионов Гордей","Марченя Ксения","Малышев Стас",
  "Масколева Варвара","Морозов Александр","Поляков Кирилл","Пургалев Дмитрий",
  "Скородинский Кирилл","Смотров Александр","Тагиев Мугад","Тетерюк Валерия",
  "Ходжаяров Хабиб","Черняков Кирилл"
];

const storageKey = "class-attendance-v4-" + new Date().toLocaleDateString("sv-SE");
let data = JSON.parse(localStorage.getItem(storageKey) || "{}");
let activeFilter = "all";
let query = "";

const list = document.getElementById("list");
const search = document.getElementById("search");
const labels = {
  present: "Пришёл",
  late: "Опоздал",
  absent: "Отсутствует"
};

function save() {
  localStorage.setItem(storageKey, JSON.stringify(data));
}

function render() {
  const q = query.trim().toLowerCase();

  const indexes = students.map((name, i) => i).filter(i => {
    const status = data[i]?.status || "";
    const matchesSearch = !q || students[i].toLowerCase().includes(q);

    let matchesFilter = true;
    if (activeFilter === "unmarked") matchesFilter = !status;
    else if (activeFilter !== "all") matchesFilter = status === activeFilter;

    return matchesSearch && matchesFilter;
  });

  if (!indexes.length) {
    list.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  list.innerHTML = indexes.map(i => {
    const status = data[i]?.status || "";
    return `
      <article class="card" data-index="${i}" data-status="${status}">
        <div class="card-top">
          <div class="badge">${String(i + 1).padStart(2, "0")}</div>
          <div class="identity">
            <div class="name">${students[i]}</div>
            <div class="current">
              <span class="dot"></span>
              <span>${labels[status] || "Не отмечен"}</span>
            </div>
          </div>
        </div>
        <div class="statuses">
          <button class="status ${status === "present" ? "active" : ""}" data-status="present">
            <span class="icon">✓</span><span>Пришёл</span>
          </button>
          <button class="status ${status === "late" ? "active" : ""}" data-status="late">
            <span class="icon">◷</span><span>Опоздал</span>
          </button>
          <button class="status ${status === "absent" ? "active" : ""}" data-status="absent">
            <span class="icon">×</span><span>Отсутствует</span>
          </button>
        </div>
      </article>
    `;
  }).join("");
}

function updateCard(card, status) {
  card.dataset.status = status;
  const current = card.querySelector(".current span:last-child");
  const dot = card.querySelector(".current .dot");

  current.textContent = labels[status] || "Не отмечен";
  dot.style.background =
    status === "present" ? "var(--green)" :
    status === "late" ? "var(--orange)" :
    status === "absent" ? "var(--red)" : "#aeb4c0";

  card.querySelectorAll(".status").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.status === status);
  });
}

list.addEventListener("click", e => {
  const button = e.target.closest(".status");
  if (!button) return;

  const card = button.closest(".card");
  const index = Number(card.dataset.index);
  const status = button.dataset.status;

  if (data[index]?.status === status) {
    delete data[index];
    updateCard(card, "");
  } else {
    data[index] = { status };
    updateCard(card, status);
  }

  save();
});

search.addEventListener("input", e => {
  query = e.target.value;
  render();
});

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    activeFilter = button.dataset.filter;
    document.querySelectorAll(".filter").forEach(b => {
      b.classList.toggle("active", b === button);
    });
    render();
  });
});

document.getElementById("resetAll").addEventListener("click", () => {
  data = {};
  save();
  render();
});

render();
</script>
</body>
</html>
